<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>あまは - AMAHA Voice AI</title>
  
  <!-- Web App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="あまは">
  <meta name="theme-color" content="#000d1a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: #000d1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-top: 10px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #00f2fe;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .visualizer-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f2fe 0%, #4facfe 40%, #000d1a 100%);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.8);
      transition: all 0.5s ease;
      position: relative;
      z-index: 2;
    }

    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px dashed rgba(0, 242, 254, 0.5);
      box-sizing: border-box;
      pointer-events: none;
      animation: rotate-hud 10s infinite linear;
    }

    @keyframes rotate-hud {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    body.listening .orb {
      background: radial-gradient(circle, #00f2fe 0%, #00c6ff 60%, #003366 100%);
      box-shadow: 0 0 60px rgba(0, 242, 254, 0.9);
      animation: pulse-hud 1.2s infinite ease-in-out;
    }

    body.thinking .orb {
      background: radial-gradient(circle, #a855f7 0%, #6366f1 60%, #1e1b4b 100%);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.8);
      animation: rotate-thinking 1s infinite linear;
    }

    body.speaking .orb {
      background: radial-gradient(circle, #00ffcc 0%, #00f2fe 60%, #003366 100%);
      box-shadow: 0 0 60px rgba(0, 255, 204, 0.9);
      animation: pulse-speaking 0.8s infinite alternate ease-in-out;
    }

    @keyframes pulse-hud {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    @keyframes rotate-thinking {
      0% { transform: scale(1) rotate(0deg); border-radius: 45%; }
      50% { transform: scale(1.05) rotate(180deg); border-radius: 50%; }
      100% { transform: scale(1) rotate(360deg); border-radius: 45%; }
    }

    @keyframes pulse-speaking {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .status-container {
      width: 100%;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .status-text {
      font-size: 0.85rem;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .transcript-text {
      font-size: 1.05rem;
      font-weight: 500;
      color: #f8fafc;
      line-height: 1.4;
      padding: 0 10px;
      word-break: break-word;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .mic-button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
      color: #000d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s, background 0.3s;
    }

    .mic-button:active {
      transform: scale(0.92);
    }

    .mic-icon {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <header>
    <h1>AMAHA SYSTEM</h1>
  </header>

  <div class="visualizer-container">
    <div class="ring"></div>
    <div class="orb"></div>
  </div>

  <div class="status-container">
    <div class="status-text" id="status">タップまたはSiriから起動してください</div>
    <div class="transcript-text" id="transcript"></div>
  </div>

  <div class="controls">
    <button class="mic-button" id="micBtn" aria-label="音声入力開始">
      <svg class="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>

  <script>
    const AI_NAME = 'あまは';

    const body = document.body;
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const micBtn = document.getElementById('micBtn');

    let isInitialized = false;

    // --- 1. ローカル記憶機能 (localStorage) ---
    function getMemory() {
      const data = localStorage.getItem('amaha_memory');
      return data ? JSON.parse(data) : { userName: 'ボス', lastTalk: '', favItem: '' };
    }

    function saveMemory(memory) {
      localStorage.setItem('amaha_memory', JSON.stringify(memory));
    }

    function getTimeBasedGreeting() {
      const memory = getMemory();
      const hour = new Date().getHours();
      let timeGreeting = '';

      if (hour >= 5 && hour < 11) {
        timeGreeting = `おはようございます、${memory.userName}。`;
      } else if (hour >= 11 && hour < 18) {
        timeGreeting = `こんにちは、${memory.userName}。`;
      } else {
        timeGreeting = `こんばんは、${memory.userName}。`;
      }

      return `${timeGreeting}${AI_NAME}です。ご指示をお待ちしております。`;
    }

    function setState(state, text = '') {
      body.className = state;
      switch (state) {
        case 'listening':
          statusEl.textContent = '聞いています...';
          transcriptEl.textContent = '';
          break;
        case 'thinking':
          statusEl.textContent = '解析・記憶を参照中...';
          break;
        case 'speaking':
          statusEl.textContent = '応答中';
          if (text) transcriptEl.textContent = text;
          break;
        default:
          statusEl.textContent = 'ボタンを押して話しかけてください';
          break;
      }
    }

    // --- 2. オフライン計算機能 ---
    function calculateMath(input) {
      try {
        let expr = input.replace(/たす|\+|プラス/g, '+')
                        .replace(/ひく|\-|マイナス/g, '-')
                        .replace(/かける|\*|×/g, '*')
                        .replace(/わる|\/|÷/g, '/')
                        .replace(/は？|は|いくら/g, '')
                        .replace(/[^0-9\+\-\*\/\.]/g, '');
        if (expr && /[0-9]/.test(expr)) {
          const result = Function(`'use strict'; return (${expr})`)();
          return `計算結果は ${result} です。`;
        }
      } catch (e) {}
      return null;
    }

    // --- 3. 応答生成メインロジック ---
    function generateAIResponse(input) {
      const text = input.trim().toLowerCase();
      const memory = getMemory();

      if (!text) return `音声がうまく検出できませんでした。もう一度お話しいただけますか、${memory.userName}？`;

      // A. YouTube連携（アプリ起動）
      if (text.includes('youtube') || text.includes('ユーチューブ') || text.includes('動画')) {
        setTimeout(() => {
          location.href = 'youtube://';
        }, 1200);
        return 'YouTubeアプリを起動します。';
      }

      // B. 他アプリ起動拡張例（マップ・カレンダー）
      if (text.includes('マップ') || text.includes('地図')) {
        setTimeout(() => { location.href = 'maps://'; }, 1200);
        return 'マップアプリを起動します。';
      }
      if (text.includes('カレンダー') || text.includes('予定')) {
        setTimeout(() => { location.href = 'calshow://'; }, 1200);
        return 'カレンダーアプリを起動します。';
      }

      // C. 名前の記憶・更新
      if (text.includes('と覚えて') || text.includes('と呼んで')) {
        const newName = text.replace(/(私の|名前を|僕の|俺の|と覚えて|と呼んで|呼んで|覚えて)/g, '').trim();
        if (newName) {
          memory.userName = newName;
          saveMemory(memory);
          return `承知いたしました。これからは「${newName}」とお呼びします。`;
        }
      }

      // D. 好きなものの記憶
      if (text.includes('が好き') || text.includes('は好き')) {
        const fav = text.replace(/(が好きなの|が好き|は好き|です)/g, '').trim();
        if (fav) {
          memory.favItem = fav;
          saveMemory(memory);
          return `「${fav}」がお好きなのですね。記憶に記録しておきます、${memory.userName}。`;
        }
      }

      // E. 記憶の参照
      if (text.includes('好きなもの') || text.includes('何が好き')) {
        if (memory.favItem) {
          return `${memory.userName}の好きなものは「${memory.favItem}」だと記憶しています。`;
        }
        return 'まだお好きなものを伺っておりません。ぜひ教えてください。';
      }

      // F. 直前の会話
      if (text.includes('さっき') || text.includes('前回の話') || text.includes('前回')) {
        if (memory.lastTalk) {
          return `前回は「${memory.lastTalk}」とお話しされていましたね。`;
        }
        return 'まだ前回の会話記録がありません。';
      }

      // G. 記憶のリセット無効化ガイダンス
      if (text.includes('記憶を消') || text.includes('リセット') || text.includes('記憶をクリア')) {
        return `大切な記憶を守るため、記憶の消去機能は無効化されています、${memory.userName}。`;
      }

      // H. 計算機能
      const mathResult = calculateMath(text);
      if (mathResult) return mathResult;

      // I. おみくじ・運勢
      if (text.includes('おみくじ') || text.includes('運勢') || text.includes('占い')) {
        const fortunes = [
          '超大吉！最高の1日になりますよ。',
          '大吉！素晴らしい成果が期待できます。',
          '吉！穏やかで良い1日です。',
          '中吉！思いがけない幸運があるかもしれません。'
        ];
        const picked = fortunes[Math.floor(Math.random() * fortunes.length)];
        return `本日の運勢ですね。診断結果は…… ${picked}`;
      }

      // J. コイン投げ・意志決定
      if (text.includes('コイン') || text.includes('どっち') || text.includes('決め')) {
        const result = Math.random() < 0.5 ? '表' : '裏';
        return `判定します。結果は「${result}」です。`;
      }

      // K. 挨拶
      if (text.includes('こんにちは') || text.includes('おはよう') || text.includes('こんばんは')) {
        return getTimeBasedGreeting();
      }

      // L. 感謝
      if (text.includes('ありがとう') || text.includes('助かった') || text.includes('すごい')) {
        const thanks = [
          `お役に立てて光栄です、${memory.userName}。`,
          `勿体無いお言葉です。いつでもサポートいたします。`,
          `恐縮です。常に最高のパフォーマンスを心がけています。`
        ];
        return thanks[Math.floor(Math.random() * thanks.length)];
      }

      // M. 時刻確認
      if (text.includes('時間') || text.includes('時') || text.includes('いま何時')) {
        const now = new Date();
        return `現在の時刻は、${now.getHours()}時${now.getMinutes()}分です。`;
      }

      // N. 日付確認
      if (text.includes('日付') || text.includes('今日') || text.includes('何日')) {
        const now = new Date();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        return `本日は ${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}曜日です。`;
      }

      // O. ステータス・自己紹介
      if (text.includes('調子') || text.includes('元気') || text.includes('誰')) {
        return `私はローカルアシスタントの${AI_NAME}です。すべての記憶データは安全に保たれています。`;
      }

      // 会話を次回用に保持
      memory.lastTalk = input;
      saveMemory(memory);

      // P. フォールバック（登録外の言葉への応答）
      const defaultResponses = [
        `「${input}」ですね。しっかり記憶に記録いたしました。`,
        `「${input}」についてのご指示、受け止めました。他にお手伝いできることはありますか？`,
        `認識いたしました。詳細な計算や記録が必要な場合は、いつでもお申し付けください、${memory.userName}。`
      ];
      return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
    }

    // --- 4. Web Speech API (音声認識) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => setState('listening');

      recognition.onresult = (event) => {
        const userText = event.results[0][0].transcript;
        transcriptEl.textContent = `「${userText}」`;
        setState('thinking');
        
        setTimeout(() => {
          const aiResponse = generateAIResponse(userText);
          speak(aiResponse);
        }, 300);
      };

      recognition.onerror = () => setState('idle');
      recognition.onend = () => {
        if (body.className === 'listening') setState('idle');
      };
    } else {
      statusEl.textContent = 'お使いの環境は音声認識に対応していません';
    }

    // --- 5. Web Speech API (音声合成) ---
    const synth = window.speechSynthesis;
    let voices = [];

    function loadVoices() {
      voices = synth.getVoices().filter(voice => voice.lang.includes('ja'));
    }
    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text, onComplete) {
      if (!synth) return;
      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.pitch = 1.1; 
      utterance.rate = 1.05; 

      if (voices.length > 0) utterance.voice = voices[0];

      utterance.onstart = () => setState('speaking', text);
      utterance.onend = () => {
        setState('idle');
        if (onComplete) onComplete();
      };
      utterance.onerror = () => setState('idle');

      synth.speak(utterance);
    }

    // --- 6. 初期化およびタップイベント ---
    micBtn.addEventListener('click', () => {
      if (!isInitialized) {
        isInitialized = true;
        speak(getTimeBasedGreeting(), () => {
          if (recognition) try { recognition.start(); } catch (e) {}
        });
        return;
      }

      if (synth && synth.speaking) {
        synth.cancel();
        setState('idle');
        return;
      }

      if (recognition) {
        try { recognition.start(); } catch (e) { recognition.stop(); }
      }
    });
  </script>
</body>
</html>
